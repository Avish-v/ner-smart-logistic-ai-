spring.application.name=ner-logistic

# PostgreSQL connection. DB_PASSWORD must be supplied through the environment.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ner_logistics}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# Development schema management. Use migrations and validate in production.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=false

server.port=8080
